# Crowdin file-based localization configuration for the ED-UP launcher.
#
# Ownership: the repository writes src/installer/l10n/launcher.pot; Crowdin is
# the sole writer of src/installer/l10n/*.po. Only proofreader-approved strings
# are exported, and untranslated/unapproved strings are omitted so the launcher
# falls back cleanly to English.
#
# Credentials come from environment variables so this file works on both forks
# and upstream without hardcoding a project ID or token:
#   CROWDIN_PROJECT_ID       numeric Crowdin project ID
#   CROWDIN_PERSONAL_TOKEN   Crowdin Personal Access Token
#
# Preconfigured Crowdin target languages (matching tools/gen_launcher_l10n.py):
#   Core (shipped with Elite): de, es-ES (-> es.po), fr, pt-BR, ru
#   Optional UI-only (activate automatically once approved): zh-CN, cs, it, ja, uk
project_id_env: CROWDIN_PROJECT_ID
api_token_env: CROWDIN_PERSONAL_TOKEN
base_path: "."
preserve_hierarchy: true

files:
  - source: /src/installer/l10n/launcher.pot
    translation: /src/installer/l10n/%two_letters_code%.po
    export_only_approved: true
    skip_untranslated_strings: true
    languages_mapping:
      two_letters_code:
        pt-BR: pt-BR
        zh-CN: zh-CN
